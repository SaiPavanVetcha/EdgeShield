<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Grid subtle -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="50" y1="100" x2="1150" y2="100" />
    <line x1="50" y1="200" x2="1150" y2="200" />
    <line x1="50" y1="300" x2="1150" y2="300" />
    <line x1="50" y1="400" x2="1150" y2="400" />
    <line x1="50" y1="500" x2="1150" y2="500" />
  </g>

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="34" rx="17" fill="#131C31" stroke="#06B6D4" stroke-width="1" />
  <circle cx="70" cy="52" r="5" fill="#00F0FF" />
  <text x="85" y="57" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">EDGESHIELD PIPELINE</text>

  <!-- Step 1: Edge Sources -->
  <rect x="50" y="140" width="180" height="300" rx="12" fill="#131C31" stroke="#334155" stroke-width="1.5" />
  <text x="140" y="175" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">EDGE SOURCES</text>

  <!-- PC Client box -->
  <rect x="70" y="200" width="140" height="90" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1" />
  <text x="140" y="235" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PC Client</text>
  <text x="140" y="255" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Python • psutil</text>
  <text x="140" y="272" fill="#06B6D4" font-family="monospace" font-size="10" text-anchor="middle">CPU • RAM • Disk</text>

  <!-- ESP32 box -->
  <rect x="70" y="315" width="140" height="90" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1" />
  <text x="140" y="350" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ESP32 Firmware</text>
  <text x="140" y="370" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">C++ / MicroPython</text>
  <text x="140" y="387" fill="#06B6D4" font-family="monospace" font-size="10" text-anchor="middle">Battery • Sensors</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 230 290 L 275 290" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="275,286 285,290 275,294" fill="#06B6D4" />

  <!-- Step 2: FastAPI Ingestion -->
  <rect x="285" y="190" width="160" height="200" rx="12" fill="#131C31" stroke="#3B82F6" stroke-width="1.5" />
  <text x="365" y="225" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">INGESTION</text>
  <rect x="305" y="250" width="120" height="110" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.5" />
  <text x="365" y="285" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">FastAPI</text>
  <text x="365" y="308" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">HTTP Telemetry Hub</text>
  <text x="365" y="330" fill="#60A5FA" font-family="monospace" font-size="10" text-anchor="middle">Async Validation</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 445 290 L 485 290" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="485,286 495,290 485,294" fill="#3B82F6" />

  <!-- Step 3: Databricks Medallion Lakehouse container -->
  <rect x="495" y="110" width="450" height="360" rx="16" fill="#0E1726" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="720" y="145" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">DATABRICKS MEDALLION LAKEHOUSE</text>

  <!-- Bronze -->
  <g transform="translate(515, 175)">
    <rect width="120" height="260" rx="10" fill="#1A181E" stroke="#B45309" stroke-width="1.5" />
    <rect x="15" y="15" width="90" height="26" rx="6" fill="url(#bronzeGrad)" />
    <text x="60" y="32" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BRONZE</text>
    <text x="60" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Raw Ingestion</text>
    <line x1="20" y1="80" x2="100" y2="80" stroke="#334155" />
    <text x="60" y="115" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">• Raw Payloads</text>
    <text x="60" y="145" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">• Append-Only</text>
    <text x="60" y="175" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">• Unmodified</text>
    <text x="60" y="205" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">• Audit Trail</text>
  </g>

  <!-- Arrow Bronze to Silver -->
  <path d="M 640 305 L 665 305" stroke="#94A3B8" stroke-width="2" />
  <polygon points="665,302 672,305 665,308" fill="#94A3B8" />

  <!-- Silver -->
  <g transform="translate(675, 175)">
    <rect width="120" height="260" rx="10" fill="#141E2E" stroke="#64748B" stroke-width="1.5" />
    <rect x="15" y="15" width="90" height="26" rx="6" fill="url(#silverGrad)" />
    <text x="60" y="32" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SILVER</text>
    <text x="60" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Cleaned &amp; Typed</text>
    <line x1="20" y1="80" x2="100" y2="80" stroke="#334155" />
    <text x="60" y="115" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">• Schema Enforced</text>
    <text x="60" y="145" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">• Deduplication</text>
    <text x="60" y="175" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">• Delta Lake</text>
    <text x="60" y="205" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">• Validated</text>
  </g>

  <!-- Arrow Silver to Gold -->
  <path d="M 800 305 L 825 305" stroke="#F59E0B" stroke-width="2" />
  <polygon points="825,302 832,305 825,308" fill="#F59E0B" />

  <!-- Gold -->
  <g transform="translate(835, 175)">
    <rect width="140" height="260" rx="10" fill="#1F1B14" stroke="#D97706" stroke-width="1.5" />
    <rect x="25" y="15" width="90" height="26" rx="6" fill="url(#goldGrad)" />
    <text x="70" y="32" fill="#451A03" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">GOLD</text>
    <text x="70" y="65" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Business Star Schema</text>
    <line x1="15" y1="80" x2="125" y2="80" stroke="#78350F" />
    <text x="70" y="105" fill="#FEF3C7" font-family="monospace" font-size="9" text-anchor="middle">dim_device</text>
    <text x="70" y="125" fill="#FCD34D" font-family="monospace" font-size="9" text-anchor="middle">fact_cpu_telemetry</text>
    <text x="70" y="145" fill="#FCD34D" font-family="monospace" font-size="9" text-anchor="middle">fact_ram_telemetry</text>
    <text x="70" y="165" fill="#FCD34D" font-family="monospace" font-size="9" text-anchor="middle">fact_disk_telemetry</text>
    <text x="70" y="185" fill="#FCD34D" font-family="monospace" font-size="9" text-anchor="middle">fact_battery_telem</text>
    <text x="70" y="205" fill="#FCD34D" font-family="monospace" font-size="9" text-anchor="middle">fact_environment</text>
    <text x="70" y="232" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Analytics-Ready</text>
  </g>

  <!-- Arrow Databricks to Serving/Dashboard -->
  <path d="M 950 290 L 985 290" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="985,286 995,290 985,294" fill="#10B981" />

  <!-- Step 4: Consumers / Dashboard / Alerts -->
  <rect x="995" y="170" width="160" height="240" rx="12" fill="#131C31" stroke="#10B981" stroke-width="1.5" />
  <text x="1075" y="205" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">SERVING</text>
  
  <rect x="1010" y="225" width="130" height="75" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.4" />
  <text x="1075" y="255" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Monitoring</text>
  <text x="1075" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Reads Gold Layer</text>

  <rect x="1010" y="315" width="130" height="75" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4" />
  <text x="1075" y="345" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Alerts &amp; Intelligence</text>
  <text x="1075" y="365" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Rules → ML → NLQ</text>

  <!-- Footer note -->
  <text x="600" y="540" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Full End-to-End Lineage: Edge Sensors → FastAPI Hub → Databricks Medallion (Bronze/Silver/Gold) → Decision-Ready Gold Layer
  </text>
</svg>
